<html lang="en">
<head>
    <title>HerHeart</title>
    <meta content="width=device-width" name="viewport"/>
    <meta charset="UTF-8">
    <link href="https://unpkg.com/survey-core@1.9.8/modern.min.css" rel="stylesheet" type="text/css"/>

<body>
<div id="surveyElement" style="display:inline-block;width:100%;"></div>
<div id="surveyResult"></div>
<div id="questionDescriptionText"></div>
<div class="share-dialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="share-card">
        <header>
            <h3 class="dialog-title" id="shareTitle">Share this quiz</h3>
            <button class="close-button" aria-label="Close">
                <span uk-icon="icon: close; ratio: 1.2"></span>
            </button>
        </header>
        <p class="share-subtitle">Spread the love and info with the people you care about.</p>
        <div class="targets">
            <a class="share-target" data-target="facebook" target="_blank" rel="noopener">
                <span uk-icon="icon: facebook; ratio: 1.4"></span> Facebook
            </a>

            <a class="share-target" data-target="twitter" target="_blank" rel="noopener">
                <span uk-icon="icon: twitter; ratio: 1.4"></span> Twitter
            </a>

            <a class="share-target" data-target="linkedin" target="_blank" rel="noopener">
                <span uk-icon="icon: linkedin; ratio: 1.4"></span> LinkedIn
            </a>

            <a class="share-target" data-target="email">
                <span uk-icon="icon: mail; ratio: 1.4"></span> Email
            </a>
        </div>
        <div class="link">
            <div class="pen-url">https://herheart-5ca67.web.app/</div>
            <button class="copy-link">Copy Link</button>
        </div>
    </div>
</div>
</body>
